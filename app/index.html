<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Repère</title>
<style>
  :root { --bg:#f6f4ef; --fg:#1d2a33; --accent:#2f6f73; --accent-fg:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141b20; --fg:#eef1f2; --accent:#5fb3b3; --accent-fg:#0f1a1c; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 24px 16px; text-align: center;
  }
  h1 { margin: 0; font-size: 2.4rem; letter-spacing: .01em; }
  a.btn {
    display: inline-block; background: var(--accent); color: var(--accent-fg);
    text-decoration: none; font-size: 1.25rem; font-weight: 700;
    padding: 20px 32px; border-radius: 16px; min-width: 260px; max-width: 100%;
  }
  a.btn:active { transform: scale(.98); }
</style>
</head>
<body>
  <h1>Repère</h1>
  <a class="btn" id="dl" href="../Repere.apk?v=1.0.7" download="Repere.apk">Télécharger l'application</a>
<script>
  try {
    var l = (navigator.language || "fr").slice(0, 2).toLowerCase();
    var t = { nl: "De app downloaden", en: "Download the app" }[l];
    if (t) { document.getElementById("dl").textContent = t; document.documentElement.lang = l; }
  } catch (e) {}
</script>
</body>
</html>
